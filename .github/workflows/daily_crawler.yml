name: Daily Video Scraper

on:
  schedule:
    - cron: '0 22 * * *' # 台灣時間 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Playwright
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: 執行爬蟲、同步試算表與更新網頁
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          python scraper.py

      - name: 自動將資料庫與網頁提交保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html || true
          if [ -f "videos.db" ]; then git add videos.db; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update database, index.html and sync gsheet [skip ci]" && git push)
